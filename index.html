<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMob.io — Головний Хаб</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            color: #00ff66;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
        p {
            color: #a0a0c0;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #00ff66, #00b344);
            color: #0f0f1a;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 35px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.8);
        }
        footer {
            position: absolute;
            bottom: 20px;
            color: #555577;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CyberMob.io</h1>
        <p>Ласкаво просимо до ігрового хабу! Обирай проєкт та запускай прямо в браузері.</p>
        
        <!-- Кнопка веде на твою гру ultimate.html -->
        <a href="ultimate.html" class="btn">🚀 Грати в Cyber Life Ultimate</a>
    </div>

    <footer>
        &copy; 2026 CyberMob. Усі права захищені.
    </footer>

</body>
</html>
